<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AL-ARABI EMS | Notification Dashboard</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:Inter,sans-serif;
background:#f4f7f8;
color:#111827;

}

header{

background:linear-gradient(135deg,#065f46,#059669);
padding:22px;
color:#fff;
box-shadow:0 10px 30px rgba(0,0,0,.15);

}

header h1{

font-family:Playfair Display,serif;
font-size:28px;

}

header p{

margin-top:6px;
opacity:.9;

}

.container{

width:95%;
max-width:1200px;
margin:30px auto;

}

.card{

background:#fff;
border-radius:20px;
padding:25px;
box-shadow:0 12px 30px rgba(0,0,0,.08);
margin-bottom:25px;

}

.card h2{

margin-bottom:20px;
font-size:20px;

}

label{

display:block;
margin-bottom:8px;
font-weight:600;

}

input{

width:100%;
height:50px;
border:1px solid #d1d5db;
border-radius:14px;
padding:0 15px;
margin-bottom:18px;
font-size:15px;

}

textarea{

width:100%;
height:220px;
border:1px solid #d1d5db;
border-radius:14px;
padding:15px;
font-size:15px;
resize:vertical;
font-family:inherit;
margin-bottom:20px;

}

button{

border:none;
cursor:pointer;
border-radius:14px;
padding:15px 28px;
font-size:15px;
font-weight:700;
transition:.3s;

}

.publish{

background:#059669;
color:#fff;

}

.publish:hover{

background:#047857;

}

.posts{

display:grid;
gap:20px;

}

.post{

background:#fff;
border-radius:18px;
padding:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border-left:6px solid #059669;

}

.post h3{

font-size:20px;
margin-bottom:10px;

}

.post p{

line-height:1.8;
color:#374151;
white-space:pre-wrap;

}

.time{

margin-top:18px;
font-size:13px;
color:#6b7280;

}

.actions{

display:flex;
gap:10px;
margin-top:18px;

}

.edit{

background:#2563eb;
color:#fff;

}

.delete{

background:#dc2626;
color:#fff;

}

.empty{

padding:80px;
text-align:center;
color:#9ca3af;
font-size:18px;

}

@media(max-width:700px){

.actions{

flex-direction:column;

}

button{

width:100%;

}

}

</style>

</head>

<body>

<header>

<h1>Notification Dashboard</h1>

<p>Create, manage and publish announcements for every student.</p>

</header>

<div class="container">

<div class="card">

<h2>Create New Notification</h2>

<label>

Notification Title

</label>

<input
id="title"
type="text"
placeholder="Enter notification title">

<label>

Notification Message

</label>

<textarea
id="message"
placeholder="Write your announcement here..."></textarea>

<button
class="publish"
id="publishBtn">

Publish Notification

</button>

</div>

<div class="card">

<h2>Published Notifications</h2>

<div
id="notificationList"
class="posts">

<div class="empty">

No notifications published.

</div>

</div>

</div>

</div>

<script>

/* PART 2 */
const SUPABASE_URL = "https://qqqxxbixuzdihfnmutpp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_oAqdfpvMyYEdeMzZuIb57w_muvQROpY";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const titleInput = document.getElementById("title");
const messageInput = document.getElementById("message");
const publishBtn = document.getElementById("publishBtn");
const notificationList = document.getElementById("notificationList");

publishBtn.addEventListener("click", publishNotification);

async function publishNotification(){

    const title = titleInput.value.trim();
    const message = messageInput.value.trim();

    if(title===""){
        alert("Enter notification title.");
        return;
    }

    if(message===""){
        alert("Enter notification message.");
        return;
    }

    publishBtn.disabled = true;
    publishBtn.innerText = "Publishing...";

    const {error} = await db
    .from("notifications")
    .insert([{
        title: title,
        message: message,
        created_at: new Date().toISOString()
    }]);

    publishBtn.disabled = false;
    publishBtn.innerText = "Publish Notification";

    if(error){
        alert(error.message);
        return;
    }

    titleInput.value = "";
    messageInput.value = "";

    loadNotifications();
}

async function loadNotifications(){

    const {data,error} = await db
    .from("notifications")
    .select("*")
    .order("created_at",{ascending:false});

    if(error){
        notificationList.innerHTML =
        `<div class="empty">Unable to load notifications.</div>`;
        return;
    }

    if(data.length===0){
        notificationList.innerHTML =
        `<div class="empty">No notifications published.</div>`;
        return;
    }

    notificationList.innerHTML = "";

    data.forEach(item=>{

        const card = document.createElement("div");
        card.className = "post";

        card.innerHTML = `
            <h3>${item.title}</h3>

            <p>${item.message}</p>

            <div class="time">
                ${new Date(item.created_at).toLocaleString()}
            </div>

            <div class="actions">

                <button
                class="edit"
                onclick="editNotification('${item.id}','${encodeURIComponent(item.title)}','${encodeURIComponent(item.message)}')">

                Edit

                </button>

                <button
                class="delete"
                onclick="deleteNotification('${item.id}')">

                Delete

                </button>

            </div>
        `;

        notificationList.appendChild(card);

    });

}

async function deleteNotification(id){

    if(!confirm("Delete this notification?")) return;

    const {error} = await db
    .from("notifications")
    .delete()
    .eq("id",id);

    if(error){
        alert(error.message);
        return;
    }

    loadNotifications();

}

window.editNotification = async function(id,title,message){

    titleInput.value = decodeURIComponent(title);
    messageInput.value = decodeURIComponent(message);

    publishBtn.innerText = "Update Notification";

    publishBtn.onclick = async function(){

        const {error} = await db

        .from("notifications")

        .update({

            title:titleInput.value.trim(),

            message:messageInput.value.trim(),

            updated_at:new Date().toISOString()

        })

        .eq("id",id);

        if(error){

            alert(error.message);

            return;

        }

        titleInput.value="";

        messageInput.value="";

        publishBtn.innerText="Publish Notification";

        publishBtn.onclick=null;

        publishBtn.addEventListener("click",publishNotification,{once:true});

        loadNotifications();

    };

};

db

.channel("notifications_live")

.on(

"postgres_changes",

{

event:"*",

schema:"public",

table:"notifications"

},

()=>{

loadNotifications();

}

)

.subscribe();

loadNotifications();
</script>

</body>

</html>
