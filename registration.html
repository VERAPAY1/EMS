<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AL-ARABI TEACHER OS | Student Registration</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4169E1;
            --secondary: #50C878;
            --accent: #9370DB;
            --highlight: #FFD700;
            --dark-bg: #0a192f;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --error: #ff4d4d;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background */
        .bg-fixed {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0a192f 0%, #112240 100%);
        }

        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('logo.png') no-repeat center center;
            background-size: cover;
            filter: blur(60px) opacity(0.15);
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-box {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            padding: 5px;
            margin: 0 auto 20px;
            box-shadow: 0 0 25px rgba(65, 105, 225, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 4s ease-in-out infinite;
        }

        .logo-box img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 50%;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--highlight);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Form Card */
        .form-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.8s ease-out;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        /* Input Styles */
        .input-group {
            position: relative;
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 15px 12px 40px;
            color: white;
            outline: none;
            transition: var(--transition);
        }

        textarea {
            padding-left: 15px;
            height: 100px;
            resize: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(65, 105, 225, 0.2);
        }

        /* Custom Select */
        select option {
            background: var(--dark-bg);
            color: white;
        }

        /* Character Counter */
        .char-counter {
            text-align: right;
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Submit Button */
        .submit-btn {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(65, 105, 225, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 47, 0.98);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .progress-container {
            width: 80%;
            max-width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--secondary);
            transition: width 0.3s ease;
        }

        .loading-text {
            color: var(--secondary);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Success Card */
        .success-card {
            background: white;
            border-radius: 28px;
            padding: 40px;
            text-align: center;
            color: #1a202c;
            max-width: 400px;
            width: 90%;
            display: none;
            z-index: 1100;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            transition: var(--transition);
        }

        .success-card.active {
            display: block;
            transform: translate(-50%, -50%) scale(1);
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background: #f0fff4;
            border: 3px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--primary);
            font-size: 2.5rem;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .reset-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            margin-top: 25px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

        /* Validation Colors */
        .invalid { border-color: var(--error) !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* Dark Mode Toggle Placeholder */
        .theme-toggle {
            position: fixed;
            top: 20px; right: 20px;
            width: 45px; height: 45px;
            background: var(--glass);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="bg-fixed">
        <div class="bg-overlay"></div>
    </div>

    <div class="theme-toggle" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
    </div>

    <div class="container">
        <header>
            <div class="logo-box">
                <img src="assets/images/logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3426/3426653.png'">
            </div>
            <h1>AL-ARABI TEACHERS OS</h1>
            <p class="subtitle">Student Registration Portal</p>
        </header>

        <form id="registration-form" class="form-card">
            <div class="form-grid">
                <!-- Personal Info -->
                <div class="input-group">
                    <label>Full Name *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" name="fullName" required placeholder="John Doe">
                    </div>
                </div>

                <div class="input-group">
                    <label>Gender *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-venus-mars"></i>
                        <select name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Date of Birth *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-calendar"></i>
                        <input type="date" name="dob" id="dob" required onchange="calculateAge()">
                    </div>
                </div>

                <div class="input-group">
                    <label>Age (Auto)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-birthday-cake"></i>
                        <input type="number" name="age" id="age" readonly placeholder="0">
                    </div>
                </div>

                <!-- Contact Info -->
                <div class="input-group">
                    <label>Parent/Guardian Name *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-shield"></i>
                        <input type="text" name="parentName" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Parent Phone Number *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" name="parentPhone" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Student Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-mobile-alt"></i>
                        <input type="tel" name="studentPhone">
                    </div>
                </div>

                <div class="input-group">
                    <label>Emergency Contact *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-ambulance"></i>
                        <input type="tel" name="emergencyContact" required>
                    </div>
                </div>

                <!-- School Info -->
                <div class="input-group" style="grid-column: 1 / -1;">
                    <label>Address *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" name="address" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>School Name *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-school"></i>
                        <input type="text" name="schoolName" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Class/Grade *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-graduation-cap"></i>
                        <input type="text" name="classGrade" required>
                    </div>
                </div>

                <!-- Academic Details -->
                <div class="input-group">
                    <label>Lesson Category *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-clock"></i>
                        <select name="category" required>
                            <option value="School">School</option>
                            <option value="Holiday">Holiday</option>
                            <option value="Night">Night</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Subject Combination *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-book"></i>
                        <input type="text" name="subjects" placeholder="e.g. Math, Science, English" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Registration Date</label>
                    <div class="input-wrapper">
                        <i class="fas fa-calendar-check"></i>
                        <input type="text" id="regDate" name="regDate" readonly>
                    </div>
                </div>

                <div class="input-group" style="grid-column: 1 / -1;">
                    <label>Notes / Medical Information</label>
                    <textarea name="notes" placeholder="Any special requirements..." maxlength="500"></textarea>
                    <div class="char-counter">0 / 500</div>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    Register Student
                </button>
            </div>
        </form>
    </div>
    <!-- Processing Overlay -->
    <div id="processing-overlay" class="overlay">
        <div class="logo-box" style="background: transparent; box-shadow: none;">
            <i class="fas fa-shield-alt" style="font-size: 4rem; color: var(--primary);"></i>
        </div>
        <div class="loading-text" id="loading-text">Initializing secure connection...</div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-dim); margin-top: 10px;">SECURE SUBMISSION TO SUPABASE</div>
    </div>

    <!-- Success Screen -->
    <div id="success-screen" class="overlay" style="background: rgba(0,0,0,0.8);">
        <div class="success-card" id="success-card">
            <div class="check-icon">
                <i class="fas fa-check"></i>
            </div>
            <h2 style="margin-bottom: 10px;">Registration Successful!</h2>
            <p style="color: #718096;">Student record has been securely processed and saved.</p>
            <div id="reg-id" style="margin-top: 15px; font-size: 0.8rem; color: var(--primary); font-weight: 700;"></div>
            <button class="reset-btn" onclick="resetForm()">Register Another Student</button>
        </div>
    </div>

    <script>
        /**
         * AL-ARABI TEACHER OS v3.52 - REGISTRATION PORTAL
         * COMPLETE REWRITE - SUPABASE INTEGRATION
         */

        // Supabase Configuration
        const SUPABASE_URL = 'https://qqqxxbixuzdihfnmutpp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oAqdfpvMyYEdeMzZuIb57w_muvQROpY';

        // Initialize Supabase Client
        let supabaseClient = null;
        
        try {
            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✓ Supabase client initialized successfully');
            } else {
                console.error('✗ Supabase library not loaded');
            }
        } catch (error) {
            console.error('✗ Failed to initialize Supabase:', error);
        }

        // Initialize Form on Page Load
        document.addEventListener('DOMContentLoaded', () => {
            // Set today's date
            const today = new Date().toLocaleDateString('en-GB');
            document.getElementById('regDate').value = today;
            
            // Attach form submit handler
            document.getElementById('registration-form').addEventListener('submit', handleRegistration);
            
            // Character counter for notes
            const notesField = document.querySelector('textarea[name="notes"]');
            const charCounter = document.querySelector('.char-counter');
            notesField.addEventListener('input', () => {
                charCounter.textContent = `${notesField.value.length} / 500`;
            });
        });

        // Calculate Age from DOB
        function calculateAge() {
            const dobInput = document.getElementById('dob').value;
            if (!dobInput) return;
            
            const dob = new Date(dobInput);
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const monthDiff = today.getMonth() - dob.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
                age--;
            }
            
            document.getElementById('age').value = age > 0 ? age : 0;
        }

        // Handle Form Submission
        async function handleRegistration(e) {
            e.preventDefault();
            const form = e.target;
            
            // Validate form
            if (!validateForm(form)) {
                alert('Please fill in all required fields.');
                return;
            }

            // Collect form data
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Disable submit button and show processing
            document.getElementById('submit-btn').disabled = true;
            showProcessing();

            // Start processing sequence
            await runProcessingSequence(data);
        }

        // Validate Required Fields
        function validateForm(form) {
            let isValid = true;
            const requiredFields = form.querySelectorAll('[required]');
            
            requiredFields.forEach(input => {
                if (!input.value || input.value.trim() === '') {
                    input.classList.add('invalid');
                    isValid = false;
                } else {
                    input.classList.remove('invalid');
                }
            });
            
            return isValid;
        }

        // Show Processing Overlay
        function showProcessing() {
            const overlay = document.getElementById('processing-overlay');
            overlay.style.display = 'flex';
            
            // Reset progress bar and text
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('loading-text').style.color = 'var(--secondary)';
        }

        // Processing Sequence with Visual Feedback
        async function runProcessingSequence(data) {
            const steps = [
                { text: "Initializing secure connection...", progress: 10 },
                { text: "Validating student information...", progress: 25 },
                { text: "Encrypting registration data...", progress: 45 },
                { text: "Preparing secure submission...", progress: 65 },
                { text: "Saving student record to database...", progress: 85 },
                { text: "Finalizing registration...", progress: 100 }
            ];

            const textEl = document.getElementById('loading-text');
            const barEl = document.getElementById('progress-bar');

            for (const step of steps) {
                textEl.innerText = step.text;
                barEl.style.width = step.progress + '%';
                
                // Execute save at 85%
                if (step.progress === 85) {
                    try {
                        await saveRegistration(data);
                    } catch (error) {
                        console.error('Registration failed:', error);
                        textEl.innerText = 'Error: ' + (error.message || 'Failed to save data');
                        textEl.style.color = 'var(--error)';
                        
                        setTimeout(() => {
                            document.getElementById('processing-overlay').style.display = 'none';
                            document.getElementById('submit-btn').disabled = false;
                        }, 3000);
                        return;
                    }
                }
                
                await new Promise(resolve => setTimeout(resolve, 800));
            }

            // Show success screen
            showSuccess();
        }

        // Save Registration to Supabase
        async function saveRegistration(data) {
            // Generate unique registration ID
            const regId = 'REG-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            
            // Generate security hash
            let securityHash = 'no-hash';
            if (window.crypto && window.crypto.subtle) {
                try {
                    const encoder = new TextEncoder();
                    const dataBuffer = encoder.encode(JSON.stringify(data) + Date.now());
                    const hashBuffer = await crypto.subtle.digest('SHA-256', dataBuffer);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    securityHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                } catch (e) {
                    console.warn('Hash generation failed:', e);
                }
            }

            // Map form data to database columns (EXACT MATCH with SQL schema)
            const dbRecord = {
                reg_id: regId,
                full_name: data.fullName,
                gender: data.gender,
                dob: data.dob,
                age: data.age ? parseInt(data.age) : null,
                parent_name: data.parentName,
                parent_phone: data.parentPhone,
                student_phone: data.studentPhone || null,
                address: data.address,
                school_name: data.schoolName,
                class_grade: data.classGrade,
                category: data.category,
                subjects: data.subjects,
                emergency_contact: data.emergencyContact,
                notes: data.notes || null,
                security_hash: securityHash
            };

            console.log('Attempting to save record:', dbRecord);

            // Save to LocalStorage as backup
            try {
                const existing = JSON.parse(localStorage.getItem('student_registrations') || '[]');
                existing.push({ ...data, regId, timestamp: new Date().toISOString() });
                localStorage.setItem('student_registrations', JSON.stringify(existing));
            } catch (e) {
                console.warn('LocalStorage save failed:', e);
            }

            // Save to Supabase
            if (!supabaseClient) {
                throw new Error('Supabase client not initialized');
            }

            const { data: responseData, error } = await supabaseClient
                .from('students')
                .insert([dbRecord])
                .select();
            
            if (error) {
                console.error('Supabase error:', error);
                throw new Error(error.message || 'Database error');
            }
            
            console.log('✓ Successfully saved to Supabase:', responseData);
            document.getElementById('reg-id').innerText = 'Registration ID: ' + regId;
        }

        // Show Success Screen
        function showSuccess() {
            document.getElementById('processing-overlay').style.display = 'none';
            document.getElementById('success-screen').style.display = 'flex';
            
            setTimeout(() => {
                document.getElementById('success-card').classList.add('active');
            }, 50);
        }

        // Reset Form
        function resetForm() {
            document.getElementById('registration-form').reset();
            document.getElementById('success-screen').style.display = 'none';
            document.getElementById('success-card').classList.remove('active');
            document.getElementById('submit-btn').disabled = false;
            
            const today = new Date().toLocaleDateString('en-GB');
            document.getElementById('regDate').value = today;
            
            // Reset character counter
            document.querySelector('.char-counter').textContent = '0 / 500';
        }

        // Theme Toggle (Placeholder)
        function toggleTheme() {
            alert('Dark mode is active by default for this premium aesthetic.');
        }
    </script>
</body>
</html>
